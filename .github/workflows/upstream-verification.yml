name: Upstream verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  upstream-tests:
    name: Offline CLI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            tools/Envoy.ControlPlane.Tools/packages.lock.json
            tests/Envoy.ControlPlane.Upstream.Tests/packages.lock.json
      - name: Restore pinned test dependencies
        run: dotnet restore tests/Envoy.ControlPlane.Upstream.Tests/Envoy.ControlPlane.Upstream.Tests.csproj --locked-mode
      - name: Build with Roslynator and run offline fixture tests
        run: dotnet test --project tests/Envoy.ControlPlane.Upstream.Tests/Envoy.ControlPlane.Upstream.Tests.csproj --configuration Release --no-restore --results-directory artifacts/test-results --report-xunit-trx --report-xunit-trx-filename upstream.trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tests-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

  bindings:
    name: Buf binding proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            tools/Envoy.ControlPlane.Tools/packages.lock.json
            tools/Envoy.ControlPlane.SchemaTools/packages.lock.json
            src/Envoy.ControlPlane/packages.lock.json
            src/Envoy.ControlPlane.AspNetCore/packages.lock.json
            src/Envoy.ControlPlane.Protocol/packages.lock.json
            src/Envoy.ControlPlane.Validation.Annotations/packages.lock.json
            src/Envoy.ControlPlane.Validation/packages.lock.json
            tests/Envoy.ControlPlane.Upstream.Tests/packages.lock.json
            tests/Envoy.ControlPlane.Protocol.Tests/packages.lock.json
            tests/Envoy.ControlPlane.Tests/packages.lock.json
            tests/Envoy.ControlPlane.TransportProbe/packages.lock.json
            tests/Envoy.ControlPlane.Validation.Tests/packages.lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            tests/validation/GoOracle/go.sum
            tests/resources/GoOracle/go.sum
      - name: Restore pinned tooling dependencies
        run: dotnet restore tools/Envoy.ControlPlane.Tools/Envoy.ControlPlane.Tools.csproj --locked-mode
      - name: Generate verified contracts with Buf
        run: dotnet run --project tools/Envoy.ControlPlane.Tools --configuration Release --no-restore -- bindings generate --cache ../upstream-sources
      - name: Build solution, run tests and Go comparisons, pack and verify fresh consumers
        run: dotnet run --project tools/Envoy.ControlPlane.Tools --configuration Release --no-restore -- repository verify ${{ matrix.os == 'ubuntu-latest' && '--coverage' || '' }}
      - name: Add coverage summary
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          report=src/Envoy.ControlPlane.Protocol/obj/upstream/results/coverage/report/SummaryGithub.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload portable coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage
          path: src/Envoy.ControlPlane.Protocol/obj/upstream/results/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload repository and package-consumer test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-tests-${{ matrix.os }}
          path: |
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/repository/**/*.trx
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/coverage/raw/**/*.trx
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/consumer/*.trx
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/validation-consumer/*.trx
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/core-consumer/*.trx
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/hosting-consumer/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Upload binding evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.os }}
          path: |
            src/Envoy.ControlPlane.Protocol/obj/upstream/results/
            src/Envoy.ControlPlane.Protocol/obj/upstream/consumer.packages.lock.json
            src/Envoy.ControlPlane.Protocol/obj/upstream/validation-consumer.packages.lock.json
            src/Envoy.ControlPlane.Protocol/obj/upstream/core-consumer.packages.lock.json
            src/Envoy.ControlPlane.Protocol/obj/upstream/hosting-consumer.packages.lock.json
            src/Envoy.ControlPlane.Protocol/bin/packages/
            src/Envoy.ControlPlane.Protocol/obj/validation/catalog.report.json
          if-no-files-found: warn
          retention-days: 14
