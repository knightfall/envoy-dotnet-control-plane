name: Test results

on:
  # Audited data-only reporter: no checkout, shell steps, caches or execution of parent artifacts.
  # Required for fork PR reporting: https://github.com/dorny/test-reporter#recommended-setup-for-public-repositories
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Upstream verification]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Publish test results
    # Parse only reports from this repository's known workflow; never check out or execute its artifacts.
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.repository.id == github.repository_id && github.event.workflow_run.path == '.github/workflows/upstream-verification.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report offline fixture tests
        if: '!cancelled()'
        uses: dorny/test-reporter@v3.2.0
        with:
          artifact: /upstream-tests-(.*)/
          name: Offline tests ($1)
          path: '**/*.trx'
          reporter: dotnet-trx
          use-actions-summary: false
          list-suites: failed
          list-tests: failed
          fail-on-empty: true
      - name: Report repository and package-consumer tests
        if: '!cancelled()'
        uses: dorny/test-reporter@v3.2.0
        with:
          artifact: /repository-tests-(.*)/
          name: Repository and consumer tests ($1)
          path: '**/*.trx'
          reporter: dotnet-trx
          use-actions-summary: false
          list-suites: failed
          list-tests: failed
          fail-on-empty: true
