name: Released Envoy interoperability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/envoy-interop.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - Envoy.ControlPlane.slnx
      - global.json
      - schemas/**
      - upstream-baseline.json
      - src/**
      - examples/Envoy.ControlPlane.Example/**
      - tests/Envoy.ControlPlane.EnvoyProbe/**
      - tests/resources/envoy/**
      - tests/resources/envoy-images.lock.json
      - tools/Envoy.ControlPlane.Tools/**

permissions:
  contents: read

concurrency:
  group: envoy-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  envoy:
    name: Envoy v1.40.1 SotW, Delta and TTL (Linux ${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            tools/Envoy.ControlPlane.Tools/packages.lock.json
            tests/Envoy.ControlPlane.EnvoyProbe/packages.lock.json
            src/Envoy.ControlPlane/packages.lock.json
            src/Envoy.ControlPlane.AspNetCore/packages.lock.json
            src/Envoy.ControlPlane.Protocol/packages.lock.json
            src/Envoy.ControlPlane.Validation.Annotations/packages.lock.json
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: tests/resources/GoOracle/go.sum
      - name: Restore pinned repository tooling
        run: dotnet restore tools/Envoy.ControlPlane.Tools --locked-mode
      - name: Generate verified discovery contracts through Buf
        run: dotnet run --project tools/Envoy.ControlPlane.Tools --configuration Release --no-restore -- bindings generate --cache ../upstream-sources
      - name: Verify released Envoy SotW, Delta reconnect/removal and TTL refresh/expiry
        run: dotnet run --project tools/Envoy.ControlPlane.Tools --configuration Release --no-restore -- envoy verify
      - name: Upload proxy pins, traffic/config evidence and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: envoy-interop-linux-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: src/Envoy.ControlPlane.Protocol/obj/upstream/results/envoy/
          if-no-files-found: warn
          retention-days: 14
