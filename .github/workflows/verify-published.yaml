name: Verify published release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-release
  cancel-in-progress: false
# Recovery for the already published candidate. Never rebuild or republish this version.
env:
  RELEASE_SOURCE_COMMIT: '000438a9c4d0bc0b58a5ec7bc55af10f5f9c0ccd'
  RELEASE_MANIFEST_SHA256: '64afa9bfb8684a2c00673dcfbd64aaeac0b97ad7d7536fc163606caec547ade8'
jobs:
  verify:
    name: Verify published release (${{ matrix.registry }})
    if: github.repository == 'knightfall/envoy-dotnet-control-plane' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        registry: [nuget, github]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # Download only the original production run's candidate.
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/release
            global.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8.0.2
        with:
          repository: knightfall/envoy-dotnet-control-plane
          run-id: '42336411459'
          artifact-ids: '13559871033'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Verify the original signed manifest and complete candidate
        run: python3 .github/release/verify-published-candidate.py "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Verify published package payloads and a fresh consumer
        shell: pwsh
        run: .github/release/verify-published.ps1 -Registry $env:RELEASE_REGISTRY -ReleaseDirectory "$env:RUNNER_TEMP/release"
        env:
          RELEASE_REGISTRY: ${{ matrix.registry }}
          GH_TOKEN: ${{ github.token }}
  announce:
    name: Announce verified release
    needs: verify
    if: github.repository == 'knightfall/envoy-dotnet-control-plane' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: read
      contents: write # GitHub requires push access to read draft release assets and announce.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8.0.2
        with:
          repository: knightfall/envoy-dotnet-control-plane
          run-id: '42336411459'
          artifact-ids: '13559871033'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Verify every draft asset and all signed bundles without executing packages
        run: |
          gh release download v1.0.0-rc.1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"
          python3 .github/release/verify-published-candidate.py "$RUNNER_TEMP/release" --assets "$RUNNER_TEMP/release-assets"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the existing draft release
        run: gh release edit v1.0.0-rc.1 --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
